<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>サブマネ</title>
<style>body{margin:0;}</style>
</head>
<body>
<style>
  /* レイアウト: スマホ幅の1画面アプリ。ログイン → 一覧 → 詳細 の3画面を切り替える。PCでは中央に端末枠で表示 */
  :root{
    --bg:#F2F2F7;
    --surface:#FFFFFF;
    --ink:#1C1C1E;
    --sub:#6E6E73;
    --line:#E3E3E8;
    --accent:#1E88F0;
    --accent-ink:#FFFFFF;
    --danger:#D93A3A;
    --trial:#E08A1E;
    --frame:#D9D9DF;
    --desk:#E4E4EA;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#000000; --surface:#1C1C1E; --ink:#F2F2F7; --sub:#98989F;
      --line:#2C2C2E; --accent:#3A9BFF; --accent-ink:#FFFFFF; --danger:#FF6B6B;
      --trial:#F0A040; --frame:#2C2C2E; --desk:#141416; color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#000000; --surface:#1C1C1E; --ink:#F2F2F7; --sub:#98989F;
    --line:#2C2C2E; --accent:#3A9BFF; --accent-ink:#FFFFFF; --danger:#FF6B6B;
    --trial:#F0A040; --frame:#2C2C2E; --desk:#141416; color-scheme: dark;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    background:var(--bg); color:var(--ink);
    font-family:"Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
    font-size:14px; overflow-x:hidden;
  }
  .device{
    max-width:400px; min-height:100%; margin:0 auto; background:var(--bg);
    display:flex; flex-direction:column; position:relative;
  }
  .statusbar,.home-ind{display:none;}
  @media (min-width:600px){
    body{padding-block:32px; display:flex; justify-content:center; align-items:flex-start; background:var(--desk);}
    .phone{
      width:390px; height:844px; flex:0 0 auto; background:var(--bg);
      border:12px solid #111; border-radius:58px; overflow:hidden; position:relative;
      display:flex; flex-direction:column;
      box-shadow:0 0 0 2px #3a3a3c, 0 24px 60px rgba(0,0,0,.28);
    }
    .statusbar{
      display:flex; justify-content:space-between; align-items:center; height:50px; flex:0 0 auto;
      padding-inline:30px 26px; font-size:15px; font-weight:600; position:relative;
    }
    .island{position:absolute; left:50%; top:11px; transform:translateX(-50%); width:120px; height:34px; background:#000; border-radius:20px;}
    .st-icons{display:flex; gap:6px; align-items:center;}
    .device{flex:1; min-height:0; max-width:none; width:100%; overflow-y:auto; scrollbar-width:none;}
    .device::-webkit-scrollbar{display:none;}
    .home-ind{display:block; flex:0 0 auto; height:26px; position:relative;}
    .home-ind::after{content:""; position:absolute; left:50%; bottom:9px; transform:translateX(-50%); width:134px; height:5px; border-radius:3px; background:var(--ink);}
  }
  .screen{flex:1; display:flex; flex-direction:column; padding-inline:16px;}
  button{font-family:inherit;}

  /* ログイン */
  .login{justify-content:flex-start; padding-top:70px;}
  .login h1{text-align:center; font-size:30px; font-weight:700; margin:0 0 44px;}
  .field{margin-bottom:18px;}
  .field label{display:block; font-size:14px; font-weight:600; margin-bottom:7px;}
  .input-wrap{display:flex; align-items:center; gap:8px; background:var(--surface); border:1px solid var(--line); border-radius:8px; padding-inline:10px;}
  .input-wrap svg{flex:0 0 auto; color:var(--sub);}
  .input-wrap input, .field > input, .field > select{
    flex:1; width:100%; border:none; background:transparent; color:var(--ink);
    font-size:14px; padding-block:11px; outline:none; font-family:inherit;
  }
  .field > input, .field > select{background:var(--surface); border:1px solid var(--line); border-radius:8px; padding-inline:10px;}
  .input-wrap:focus-within, .field > input:focus, .field > select:focus{border-color:var(--accent);}
  .btn-primary{
    width:100%; background:var(--accent); color:var(--accent-ink); border:none;
    border-radius:22px; padding:12px; font-size:15px; font-weight:600; cursor:pointer; margin-top:10px;
  }
  .login-links{margin-top:26px; display:flex; flex-direction:column; gap:8px; padding-left:12px;}
  .login-links button{background:none; border:none; color:var(--ink); font-size:14px; text-align:left; cursor:pointer; padding:0;}
  .login-links button::before{content:"・";}
  .msg{font-size:12px; margin-top:10px; min-height:16px; text-align:center;}
  .msg.err{color:var(--danger);} .msg.ok{color:var(--accent);}

  /* 一覧 */
  .navbar{display:flex; justify-content:space-between; align-items:center; padding-block:16px 6px;}
  .navbar button{display:flex; align-items:center; gap:5px; background:none; border:none; color:var(--ink); font-size:14px; cursor:pointer; padding:6px 2px;}
  .navbar button.current{font-weight:700;}
  .total{text-align:center; padding-block:22px 22px;}
  .total .label{font-size:14px; font-weight:600;}
  .total .amount{font-size:32px; font-weight:700; margin-top:4px; font-variant-numeric:tabular-nums;}
  .section-title{display:flex; justify-content:space-between; align-items:center; font-weight:700; font-size:14px; margin-bottom:10px;}
  .sort{font-size:12px; font-weight:400; color:var(--sub); background:none; border:none; cursor:pointer;}
  .list{display:flex; flex-direction:column; gap:8px; padding-bottom:30px;}
  .item{
    display:flex; align-items:center; gap:10px; background:var(--surface);
    border-radius:10px; padding:9px 10px; cursor:pointer; border:none; width:100%; text-align:left; color:var(--ink);
  }
  .item.cancelled{opacity:.45;}
  .icon{width:34px; height:34px; border-radius:8px; display:flex; align-items:center; justify-content:center; color:#fff; font-weight:700; font-size:16px; flex:0 0 auto;}
  .icon.big{width:56px; height:56px; border-radius:12px; font-size:26px;}
  .item-body{flex:1; min-width:0;}
  .item-name{font-size:14px; font-weight:600; display:flex; align-items:center; gap:6px;}
  .item-name span:first-child{white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .item-sub{font-size:11px; color:var(--sub); margin-top:2px;}
  .item-price{font-weight:600; font-variant-numeric:tabular-nums;}
  .chev{color:var(--sub); flex:0 0 auto;}
  .tag{font-size:10px; padding:1px 6px; border-radius:999px; color:#fff; flex:0 0 auto; font-weight:600;}
  .search{display:flex; align-items:center; gap:6px; background:var(--surface); border:1px solid var(--line); border-radius:10px; padding-inline:10px; margin-bottom:14px; color:var(--sub);}
  .search input{flex:1; border:none; background:transparent; color:var(--ink); font-size:14px; padding-block:9px; outline:none; font-family:inherit; min-width:0;}
  .clock{display:inline-flex; color:var(--trial); flex:0 0 auto;}
  .item-sub.soon{color:var(--trial); font-weight:600;}
  .total-sub{font-size:11px; color:var(--sub); margin-top:6px;}
  .item-price small{font-size:10px; color:var(--sub); font-weight:400; margin-left:1px;}
  .tag.cyc{background:var(--accent);}
  .notice{background:var(--surface); border:1px solid var(--trial); border-radius:10px; padding:10px 12px; margin-bottom:14px; display:flex; flex-direction:column; gap:8px;}
  .notice-title{display:flex; align-items:center; gap:6px; font-weight:700; font-size:13px; color:var(--trial);}
  .notice-row{display:flex; align-items:center; gap:10px; font-size:12px;}
  .notice-text{flex:1; min-width:0; line-height:1.5;}
  .notice-btns{display:flex; gap:6px; flex:0 0 auto;}
  .notice-foot{font-size:10px; color:var(--sub);}
  .mini{font-size:12px; padding:5px 10px; border-radius:8px; border:1px solid var(--line); background:var(--bg); color:var(--ink); cursor:pointer; font-family:inherit;}
  .mini.primary{background:var(--accent); color:var(--accent-ink); border-color:var(--accent);}
  .ad{display:flex; align-items:center; gap:10px; border:1px solid var(--line); border-radius:12px; padding:10px 12px; margin-bottom:10px; background:var(--surface); position:sticky; bottom:10px; z-index:3; box-shadow:0 6px 20px rgba(0,0,0,.14);}
  .ad-label{font-size:10px; color:var(--sub); border:1px solid var(--line); border-radius:4px; padding:1px 5px; flex:0 0 auto;}
  .ad-body{display:flex; flex-direction:column; gap:2px; font-size:12px; color:var(--sub);}
  .ad-body b{color:var(--ink); font-size:13px;}
  .list{padding-bottom:14px !important;}
  .hint{font-size:11px; color:var(--sub); margin:-8px 0 14px; line-height:1.6;}
  .set-h{font-size:13px; color:var(--sub); margin:20px 0 8px; font-weight:600;}
  .settings-list .r span:last-child.ok{color:var(--accent);}
  .settings-list .r span:last-child.err{color:var(--danger);}
  .settings-list .r{gap:12px;} .settings-list .r span:last-child{text-align:right;}
  .x{margin-left:auto; background:none; border:none; color:var(--sub); font-size:16px; cursor:pointer; line-height:1; padding:0 2px;}
  a.ad{text-decoration:none; color:inherit; cursor:pointer;}
  .ad .icon{width:30px; height:30px; font-size:14px;}
  .ad-body{flex:1; min-width:0;}
  .ad-cta{font-size:12px; color:var(--accent); font-weight:600; flex:0 0 auto;}
  .chk{font-size:12px; border-radius:8px; padding:8px 10px; margin-bottom:8px; line-height:1.5;}
  .chk.err{background:color-mix(in srgb, var(--danger) 12%, transparent); color:var(--danger);}
  .chk.warn{background:color-mix(in srgb, var(--trial) 14%, transparent); color:var(--trial);}
  .chk.ok{background:color-mix(in srgb, var(--accent) 12%, transparent); color:var(--accent);}
  .btn-primary.disabled{opacity:.4; pointer-events:none;}
  .tag.trial{background:var(--trial);} .tag.off{background:var(--sub);}
  .empty{text-align:center; color:var(--sub); padding:40px 0; line-height:1.8;}

  /* 詳細・フォーム */
  .topbar{display:grid; grid-template-columns:1fr auto 1fr; align-items:center; padding-block:16px 10px;}
  .topbar .back{justify-self:start; background:none; border:none; color:var(--ink); font-size:14px; cursor:pointer; display:flex; align-items:center; gap:2px; padding:4px 0;}
  .topbar .title{font-weight:600;}
  .topbar .right{justify-self:end; background:none; border:none; color:var(--ink); font-size:14px; cursor:pointer;}
  .hero{display:flex; flex-direction:column; align-items:center; gap:8px; padding-block:22px 18px;}
  .hero .name{font-weight:700;}
  .info{background:var(--surface); border-radius:10px; padding:10px 12px; display:flex; flex-direction:column; gap:6px;}
  .info-row{display:grid; grid-template-columns:auto 1fr; gap:4px 8px; font-size:13px; align-items:start;}
  .info-row .k{display:flex; align-items:center; gap:5px; font-weight:700; width:108px;}
  .info-row .k svg{color:var(--sub);}
  .info-row .v::before{content:"："; }
  .actions{display:flex; flex-direction:column; gap:8px; margin-top:16px; padding-bottom:24px;}
  .btn-sub{background:var(--surface); border:1px solid var(--line); color:var(--accent); border-radius:10px; padding:11px; font-size:14px; font-weight:600; cursor:pointer; text-align:center; text-decoration:none;}
  .btn-sub.danger{color:var(--danger);}
  .confirm{background:var(--surface); border:1px solid var(--danger); border-radius:10px; padding:12px; font-size:13px;}
  .confirm p{margin:0 0 10px;}
  .confirm .row{display:flex; gap:8px;}
  .confirm .row button{flex:1;}
  .form{padding-bottom:24px;}
  .row2{display:flex; gap:10px;} .row2 .field{flex:1; min-width:0;}
  .settings-list{background:var(--surface); border-radius:10px; overflow:hidden;}
  .settings-list .r{display:flex; justify-content:space-between; padding:13px 12px; border-bottom:1px solid var(--line);}
  .settings-list .r:last-child{border-bottom:none;}
  .settings-list .r span:last-child{color:var(--sub);}
</style>

  function cloneSamples(){ return SAMPLE_SUBS.map(function(x){ return Object.assign({}, x); }); }

  function migrate(d){
    d.applied = d.applied || {}; d.revLog = d.revLog || []; d.updatedAt = d.updatedAt || 0; delete d.acks;
    d.subs.forEach(function(s){
      if(!s.cycle) s.cycle = "month";
      if(!s.anchor){
        var j = (s.joined || iso(today())).split("-");
        s.anchor = j[0] + "-" + j[1] + "-" + String(s.billingDay || Number(j[2])).padStart(2,"0");
      }
    });
    return d;
  }
  function load(){
    try{ var raw = localStorage.getItem(KEY); if(raw){ var d = JSON.parse(raw); if(d && d.subs) return migrate(d); } }catch(e){}

  var db = load();
  var catalog = {data: FALLBACK_CATALOG, source: "local"};

  /* ---- 通信1：料金カタログの取得 ---- */
  var CATALOG_SOURCES = [
    {url: "https://raw.githubusercontent.com/submane/submane/main/catalog.json", label: "GitHubから取得"},
    {url: "./catalog.json", label: "サーバーから取得"}
  ];
  function loadCatalog(){
    var i = 0;
    (function next(){
      if(i >= CATALOG_SOURCES.length) return; /* どこからも取れなければ内蔵の既定カタログのまま動く */
      var src = CATALOG_SOURCES[i++];
      fetch(src.url, {cache:"no-store"}).then(function(r){
        if(!r.ok) throw new Error(r.status);
        return r.json();
      }).then(function(json){
        if(!json || !Array.isArray(json.services)) throw new Error("bad");
        catalog = {data: json, source: src.label, fetchedAt: Date.now()};
        autoApply();
        rerenderIfIdle();
      }).catch(next);
    })();
  }

  function rerenderIfIdle(){
    if(view.name === "list" || view.name === "settings" || view.name === "detail") render();
  }

  function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }
  function yen(n){ return "¥" + Number(n||0).toLocaleString("ja-JP"); }
  function jpDate(s){ if(!s) return "-"; var p = s.split("-"); return Number(p[0])+"年"+Number(p[1])+"月"+Number(p[2])+"日"; }
  function today(){ var d = new Date(); d.setHours(0,0,0,0); return d; }
  function parse(s){ return new Date(s + "T00:00:00"); }
  function daysTo(d){ return Math.round((d - today()) / 86400000); }
  function md(d){ return (d.getMonth()+1)+"月"+d.getDate()+"日"; }

  var CYCLES = {month:"毎月", year:"毎年", week:"毎週"};
  var UNITS = {month:"月", year:"年", week:"週"};
  var WEEKDAYS = ["日","月","火","水","木","金","土"];

  function addCycle(d, cycle, n, anchorDay){
    var r = new Date(d);
    if(cycle === "week"){ r.setDate(r.getDate() + 7*n); return r; }
    var months = cycle === "year" ? 12*n : n;
    var y = r.getFullYear(), m = r.getMonth() + months;
    var last = new Date(y, m + 1, 0).getDate();
    return new Date(y, m, Math.min(anchorDay, last));
  }
  /* 更新基準日と請求周期から、今日以降で最初の更新日を求める */
  function nextRenew(s){
    var a = parse(s.anchor), t = today(), day = a.getDate();
    if(a >= t) return a;
    var n = 0, d = a;
    if(s.cycle === "week"){ n = Math.ceil((t - a) / (7*86400000)); return addCycle(a, "week", n, day); }
    var per = s.cycle === "year" ? 12 : 1;
    n = Math.floor(((t.getFullYear() - a.getFullYear())*12 + (t.getMonth() - a.getMonth())) / per);
    d = addCycle(a, s.cycle, n, day);
    while(d < t){ n++; d = addCycle(a, s.cycle, n, day); }
    return d;
  }
  function cycleText(s){
    var a = parse(s.anchor);
    if(s.cycle === "year") return "毎年" + md(a);
    if(s.cycle === "week") return "毎週" + WEEKDAYS[a.getDay()] + "曜日";
    return "毎月" + a.getDate() + "日";
  }
  function perMonth(s){
    if(s.cycle === "year") return s.price / 12;
    if(s.cycle === "week") return s.price * 52 / 12;
    return Number(s.price);
  }
  function priceText(s){ return yen(s.price) + " / " + UNITS[s.cycle || "month"]; }

  function inTrial(s){ return s.trialEnd && parse(s.trialEnd) >= today(); }
  function find(id){ return db.subs.filter(function(s){return s.id===id;})[0]; }
  function go(name, id){ view.name = name; view.id = id || null; view.confirm = false; view.msg = ""; render(); app.scrollTop = 0; window.scrollTo(0,0); }

  /* ---- 料金改定の検出 ---- */
  function catalogPlan(s){
    var svc = catalog.data.services.filter(function(x){ return x.name === s.name; })[0];
    if(!svc) return null;
    var plan = svc.plans.filter(function(p){ return p.name === s.plan; })[0];
    return plan ? {svc: svc, plan: plan} : null;
  }
  /* 通信で取得したカタログの料金を、登録中のサブスクへ自動で反映する。
     同じ版では一度しか反映しないので、利用者が手で直した料金は次の版まで保たれる */
  function autoApply(){
    if(catalog.source === "local") return;
    var v = catalog.data.version, changed = false;
    db.subs.forEach(function(s){
      if(s.status === "解約済み" || db.applied[s.id] === v) return;
      var c = catalogPlan(s);
      if(!c) return;
      var cyc = c.plan.cycle || "month";
      if(Number(c.plan.price) !== Number(s.price) || cyc !== s.cycle){
        db.revLog.push({name: s.name, plan: s.plan, from: priceText(s), to: yen(c.plan.price) + " / " + UNITS[cyc], version: v});
        s.price = Number(c.plan.price); s.cycle = cyc;
      }
      db.applied[s.id] = v; changed = true;
    });
    if(changed) save();
  }

  function deadline(s){ return inTrial(s) ? parse(s.trialEnd) : nextRenew(s); }
  function sorted(){

    arr.sort(function(a,b){

      if(ac !== bc) return ac ? 1 : -1;
      if(view.sort === "price") return perMonth(b) - perMonth(a);
      return deadline(a) - deadline(b);

  }

  function itemHtml(s){
    var off = s.status === "解約済み";

  /* 登録中のサブスクと同じカテゴリの、まだ契約していないサービスを広告として出す */
  function pickAd(){
    var mine = db.subs.filter(function(s){ return s.status !== "解約済み"; });
    var names = mine.map(function(s){ return s.name; });
    var cands = [];
    mine.forEach(function(s){
      var svc = catalog.data.services.filter(function(x){ return x.name === s.name; })[0];
      if(!svc || !svc.category) return;
      catalog.data.services.forEach(function(o){
        if(o.category !== svc.category || names.indexOf(o.name) >= 0) return;
        var p = o.plans.slice().sort(function(a,b){ return perMonth({price:a.price,cycle:a.cycle||"month"}) - perMonth({price:b.price,cycle:b.cycle||"month"}); })[0];
        var diff = Math.round(perMonth(s) - perMonth({price:p.price, cycle:p.cycle||"month"}));
        cands.push({svc:o, plan:p, vs:s, diff:diff});
      });
    });
    if(!cands.length) return null;
    cands.sort(function(a,b){ return b.diff - a.diff; });
    var top = cands.filter(function(c){ return c.diff > 0; });
    var pool = top.length ? top.slice(0, 3) : cands.slice(0, 3);
    return pool[view.adSeed % pool.length];
  }

    if((b = document.getElementById("postBtn"))) b.addEventListener("click", function(){ go("post", s.id); });
    if((b = document.getElementById("cancelStart"))) b.addEventListener("click", function(){ view.confirm = true; renderDetail(); });
    if((b = document.getElementById("cancelNo"))) b.addEventListener("click", function(){ view.confirm = false; renderDetail(); });
    if((b = document.getElementById("cancelYes"))) b.addEventListener("click", function(){
      s.status = "解約済み"; s.cancelled = iso(today()); save(); view.confirm = false; renderDetail();
    });
    if((b = document.getElementById("restore"))) b.addEventListener("click", function(){ s.status = "契約中"; s.cancelled = ""; save(); renderDetail(); });
  }

  function renderForm(){
    var editing = view.id ? find(view.id) : null;
    var s = editing || {name:"", plan:"", price:"", cycle:"month", anchor:iso(today()), joined:iso(today()), payment:"クレジットカード", trialEnd:"", joinUrl:"", cancelUrl:"", cancelInfo:""};
    var svcOpts = '<option value="">カタログから選ぶ（任意）</option>' + catalog.data.services.map(function(x, i){
      return '<option value="'+i+'"'+(x.name === s.name ? " selected" : "")+'>'+esc(x.name)+'</option>';
    }).join("");
    var cycOpts = ["month","year","week"].map(function(k){ return '<option value="'+k+'"'+(s.cycle===k?" selected":"")+'>'+CYCLES[k]+'</option>'; }).join("");

    app.innerHTML =
      '<div class="screen">' +
        '<div class="topbar"><button class="back" id="back">'+ICONS.back+'戻る</button><span class="title">'+(editing?"編集":"サブスク追加")+'</span><span></span></div>' +
        '<form class="form" id="subForm">' +
          '<div class="field"><label for="f_cat">サービス</label><select id="f_cat">'+svcOpts+'</select></div>' +
          '<div class="field" id="planPick" hidden><label for="f_catplan">プラン</label><select id="f_catplan"></select></div>' +
          '<div class="field"><label for="f_name">サービス名</label><input id="f_name" value="'+esc(s.name)+'" placeholder="例: Netflix" required></div>' +
          '<div class="row2"><div class="field"><label for="f_plan">プラン名</label><input id="f_plan" value="'+esc(s.plan)+'" placeholder="例: スタンダード"></div>' +
          '<div class="field"><label for="f_price">料金（円）</label><input id="f_price" type="number" min="0" value="'+esc(s.price)+'" required></div></div>' +
          '<div class="row2"><div class="field"><label for="f_cycle">請求周期</label><select id="f_cycle">'+cycOpts+'</select></div>' +
          '<div class="field"><label for="f_anchor">更新基準日</label><input id="f_anchor" type="date" value="'+esc(s.anchor)+'"></div></div>' +
          '<p class="hint" id="cycHint"></p>' +
          '<div class="row2"><div class="field"><label for="f_joined">登録日</label><input id="f_joined" type="date" value="'+esc(s.joined)+'"></div>' +
          '<div class="field"><label for="f_trial">無料期間の終了日</label><input id="f_trial" type="date" value="'+esc(s.trialEnd)+'"></div></div>' +
          '<div class="field"><label for="f_pay">支払方法</label><input id="f_pay" value="'+esc(s.payment)+'"></div>' +
          '<div class="field"><label for="f_join">入会ページURL</label><input id="f_join" type="url" value="'+esc(s.joinUrl)+'" placeholder="https://"></div>' +
          '<div class="field"><label for="f_cancel">退会ページURL</label><input id="f_cancel" type="url" value="'+esc(s.cancelUrl)+'" placeholder="https://"></div>' +
          '<div class="field"><label for="f_info">解約方法のメモ</label><input id="f_info" value="'+esc(s.cancelInfo)+'" placeholder="例: アカウント設定から解約"></div>' +
          '<button class="btn-primary" type="submit">保存する</button>' +
          (editing ? '<button class="btn-sub danger" type="button" id="del" style="width:100%;margin-top:10px;">このサブスクを削除</button>' : '') +
        '</form>' +
      '</div>';

    var $ = function(id){ return document.getElementById(id); };
    var chosenColor = editing ? editing.color : null;

    function updateHint(){
      var tmp = {cycle: $("f_cycle").value, anchor: $("f_anchor").value || iso(today())};
      var np = nextRenew(tmp);
      $("cycHint").textContent = "引き落とし日は" + cycleText(tmp) + "、次回更新日は" + md(np) + "になります";
    }
    function fillPlans(){
      var i = $("f_cat").value;
      if(i === ""){ $("planPick").hidden = true; return; }
      var svc = catalog.data.services[Number(i)];
      $("planPick").hidden = false;
      $("f_catplan").innerHTML = svc.plans.map(function(p, j){
        return '<option value="'+j+'"'+(p.name === $("f_plan").value ? " selected" : "")+'>'+esc(p.name)+'　'+esc(yen(p.price))+' / '+UNITS[p.cycle||"month"]+'</option>';
      }).join("");
    }
    function applyCatalog(){
      var i = $("f_cat").value; if(i === "") return;
      var svc = catalog.data.services[Number(i)], p = svc.plans[Number($("f_catplan").value) || 0];
      $("f_name").value = svc.name; $("f_plan").value = p.name; $("f_price").value = p.price;
      $("f_cycle").value = p.cycle || "month";
      $("f_join").value = svc.joinUrl || ""; $("f_cancel").value = svc.cancelUrl || ""; $("f_info").value = svc.cancelInfo || "";
      chosenColor = svc.color || chosenColor;
      updateHint();
    }
    fillPlans(); updateHint();
    $("f_cat").addEventListener("change", function(){ fillPlans(); applyCatalog(); });
    $("f_catplan").addEventListener("change", applyCatalog);
    $("f_cycle").addEventListener("change", updateHint);
    $("f_anchor").addEventListener("change", updateHint);

    $("back").addEventListener("click", function(){ editing ? go("detail", editing.id) : go("list"); });
    $("subForm").addEventListener("submit", function(e){
      e.preventDefault();
      var d = {
        name: $("f_name").value.trim(),
        plan: $("f_plan").value.trim(),
        price: Number($("f_price").value) || 0,
        cycle: $("f_cycle").value,
        anchor: $("f_anchor").value || iso(today()),
        joined: $("f_joined").value,
        payment: $("f_pay").value.trim(),
        trialEnd: $("f_trial").value,
        joinUrl: $("f_join").value.trim(),
        cancelUrl: $("f_cancel").value.trim(),
        cancelInfo: $("f_info").value.trim()
      };
      if(!d.name) return;
      if(editing){ Object.assign(editing, d); if(chosenColor) editing.color = chosenColor; save(); go("detail", editing.id); }
      else {
        var colors = ["#1E88F0","#7A4FD1","#D9572B","#178A7A","#B8336A","#4A6070"];
        d.id = "u" + Date.now(); d.status = "契約中"; d.cancelled = ""; d.color = chosenColor || colors[db.subs.length % colors.length];
        db.subs.push(d); save(); go("list");
      }
    });
    var del = $("del");
    if(del) del.addEventListener("click", function(){
      if(del.dataset.armed){ db.subs = db.subs.filter(function(x){return x.id!==editing.id;}); save(); go("list"); }
      else { del.dataset.armed = "1"; del.textContent = "もう一度押すと削除します"; }
    });
  }


  /* ---- 解約情報の投稿：GitHubのIssueとして送り、運営が確認してからカタログに反映する ---- */
  var REPO = "https://github.com/submane/submane";
  function baseHost(u){
    try{
      var h = new URL(u).hostname.replace(/^www\./, "").split(".");
      var n = /\.(co|ne|or|ac|go)\.jp$/.test("." + h.slice(-2).join(".")) ? 3 : 2;
      return h.slice(-n).join(".");
    }catch(e){ return ""; }
  }
  function checkPost(d){
    var errs = [], warns = [];
    if(!d.name) errs.push("サービス名を入力してください");
    if(!d.cancelUrl && !d.cancelInfo) errs.push("退会ページURLか解約方法のどちらかを入力してください");
    [["入会ページURL", d.joinUrl], ["退会ページURL", d.cancelUrl]].forEach(function(f){
      if(!f[1]) return;
      var ok = false; try{ ok = new URL(f[1]).protocol === "https:"; }catch(e){}
      if(!ok) errs.push(f[0] + "は https:// から始まる正しいURLにしてください");
    });
    var svc = catalog.data.services.filter(function(x){ return x.name === d.name; })[0];
    if(svc){
      var official = baseHost(svc.joinUrl);
      [["入会ページURL", d.joinUrl], ["退会ページURL", d.cancelUrl]].forEach(function(f){
        if(f[1] && official && baseHost(f[1]) && baseHost(f[1]) !== official)
          warns.push(f[0] + "のドメインが公式サイトの " + official + " と違います。公式のページか確認してください");
      });
      var same = svc.cancelUrl === d.cancelUrl && (svc.cancelInfo || "") === d.cancelInfo &&
                 svc.plans.some(function(p){ return p.name === d.plan && Number(p.price) === Number(d.price); });
      if(same) warns.push("料金カタログの内容と同じです。変更がなければ投稿は不要です");
    } else {
      warns.push("料金カタログにないサービスです。新規追加の投稿として扱われます");
    }
    return {errs: errs, warns: warns};
  }
  function postBody(d){
    return [
      "## 解約情報の投稿",
      "- サービス名: " + d.name,
      "- プラン名: " + (d.plan || "-"),
      "- 料金: " + (d.price ? d.price + "円 / " + UNITS[d.cycle] : "-"),
      "- 入会ページURL: " + (d.joinUrl || "-"),
      "- 退会ページURL: " + (d.cancelUrl || "-"),
      "- 解約方法: " + (d.cancelInfo || "-"),
      "- 補足: " + (d.note || "-"),
      "",
      "## 運営の確認項目",
      "- [ ] URLが公式サイトのページである",
      "- [ ] 料金・プラン名が公式サイトと一致している",
      "- [ ] 解約方法の手順が現在の画面と一致している",
      "- [ ] catalog.json に反映し、version を更新した",
      "",
      "サブマネのアプリから投稿 / 対象カタログ " + catalog.data.version + " 版"
    ].join("\n");
  }
  function renderPost(){
    var s = find(view.id); if(!s) return go("list");
    app.innerHTML =
      '<div class="screen">' +
        '<div class="topbar"><button class="back" id="back">'+ICONS.back+'戻る</button><span class="title">解約情報の投稿</span><span></span></div>' +
        '<p class="hint" style="margin:0 0 14px;">入力した内容を運営に送ります。運営が公式サイトと照らし合わせて確認したあと、料金カタログに反映され、すべての利用者に配信されます。</p>' +
        '<form class="form" id="postForm">' +
          '<div class="field"><label for="p_name">サービス名</label><input id="p_name" value="'+esc(s.name)+'"></div>' +
          '<div class="row2"><div class="field"><label for="p_plan">プラン名</label><input id="p_plan" value="'+esc(s.plan)+'"></div>' +
          '<div class="field"><label for="p_price">料金（円）</label><input id="p_price" type="number" min="0" value="'+esc(s.price)+'"></div></div>' +
          '<div class="field"><label for="p_cycle">請求周期</label><select id="p_cycle">'+["month","year","week"].map(function(k){ return '<option value="'+k+'"'+(s.cycle===k?" selected":"")+'>'+CYCLES[k]+'</option>'; }).join("")+'</select></div>' +
          '<div class="field"><label for="p_join">入会ページURL</label><input id="p_join" type="url" value="'+esc(s.joinUrl)+'"></div>' +
          '<div class="field"><label for="p_cancel">退会ページURL</label><input id="p_cancel" type="url" value="'+esc(s.cancelUrl)+'"></div>' +
          '<div class="field"><label for="p_info">解約方法</label><input id="p_info" value="'+esc(s.cancelInfo)+'"></div>' +
          '<div class="field"><label for="p_note">補足</label><input id="p_note" placeholder="例: 退会ページの場所が変わっていた"></div>' +
          '<div id="checkBox"></div>' +
          '<a class="btn-primary" id="sendBtn" target="_blank" rel="noopener" style="display:block;text-align:center;text-decoration:none;">GitHubで投稿する</a>' +
          '<button class="btn-sub" type="button" id="copyBtn" style="width:100%;margin-top:8px;">投稿内容をコピー</button>' +
          '<p class="hint" style="margin-top:10px;">投稿にはGitHubのアカウントが必要です。投稿の確認状況はGitHubのIssueで見られます。</p>' +
        '</form>' +
      '</div>';
    var $ = function(id){ return document.getElementById(id); };
    function read(){
      return {name:$("p_name").value.trim(), plan:$("p_plan").value.trim(), price:Number($("p_price").value)||0, cycle:$("p_cycle").value,
              joinUrl:$("p_join").value.trim(), cancelUrl:$("p_cancel").value.trim(), cancelInfo:$("p_info").value.trim(), note:$("p_note").value.trim()};
    }
    function update(){
      var d = read(), r = checkPost(d);
      $("checkBox").innerHTML = r.errs.map(function(e){ return '<div class="chk err">'+esc(e)+'</div>'; }).join("") +
                                r.warns.map(function(w){ return '<div class="chk warn">'+esc(w)+'</div>'; }).join("") +
                                (!r.errs.length && !r.warns.length ? '<div class="chk ok">入力内容に問題はありません</div>' : "");
      var btn = $("sendBtn");
      if(r.errs.length){ btn.removeAttribute("href"); btn.classList.add("disabled"); btn.setAttribute("aria-disabled","true"); }
      else {
        btn.href = REPO + "/issues/new?title=" + encodeURIComponent("【解約情報】" + d.name + (d.plan ? " " + d.plan : "")) + "&body=" + encodeURIComponent(postBody(d));
        btn.classList.remove("disabled"); btn.removeAttribute("aria-disabled");
      }
    }
    app.querySelectorAll("#postForm input, #postForm select").forEach(function(el){ el.addEventListener("input", update); el.addEventListener("change", update); });
    $("back").addEventListener("click", function(){ go("detail", s.id); });
    $("postForm").addEventListener("submit", function(e){ e.preventDefault(); });
    $("copyBtn").addEventListener("click", function(){
      var text = postBody(read()), btn = $("copyBtn");
      var done = function(){ btn.textContent = "コピーしました"; };
      try{ navigator.clipboard.writeText(text).then(done, function(){ fallbackCopy(text); done(); }); }catch(e){ fallbackCopy(text); done(); }
    });
    update();
  }
  function fallbackCopy(t){
    var ta = document.createElement("textarea"); ta.value = t; document.body.appendChild(ta); ta.select();
    try{ document.execCommand("copy"); }catch(e){} ta.remove();
  }

  function timeText(t){ if(!t) return ""; var d = new Date(t); return (d.getMonth()+1)+"/"+d.getDate()+" "+String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0"); }

  function renderSettings(){
    app.innerHTML =
      '<div class="screen">' + navbar("settings") +
        '<h2 style="font-size:17px;margin:18px 0 12px;">設定</h2>' +
        '<div class="settings-list">' +
          '<div class="r"><span>ログイン中</span><span>'+esc(db.session)+'</span></div>' +
          '<div class="r"><span>ご利用プラン</span><span>無料プラン・広告あり</span></div>' +
          '<div class="r"><span>登録件数</span><span>'+db.subs.length+'件</span></div>' +
        '</div>' +
        '<h3 class="set-h">通信</h3>' +
        '<div class="settings-list">' +
          '<div class="r"><span>料金カタログ</span><span>'+esc(catalog.data.version)+'版・'+(catalog.source === "local" ? "端末内の既定データ" : catalog.source)+'</span></div>' +
          '<div class="r"><span>最終取得</span><span>'+(catalog.fetchedAt ? timeText(catalog.fetchedAt) : "-")+'</span></div>' +
        '</div>' +
        '<p class="hint">料金カタログは運営側が各サービスの料金を管理して配信します。登録中の料金と違う場合はホームにお知らせが出ます。</p>' +
        '<div class="actions">' +
          '<button class="btn-sub" id="refresh">料金カタログを再取得</button>' +
          '<button class="btn-sub" id="reset">サンプルデータに戻す</button>' +
          '<button class="btn-sub danger" id="logout">ログアウト</button>' +
        '</div>' +
      '</div>';
    bindNav();
    document.getElementById("refresh").addEventListener("click", function(){ loadCatalog(); });
    document.getElementById("logout").addEventListener("click", function(){ db.session = null; save(); view.loginMode = "login"; go("login"); });
    document.getElementById("reset").addEventListener("click", function(){ db.subs = cloneSamples(); db.applied = {}; db.revLog = []; autoApply(); save(); go("list"); });
  }

  render();
  loadCatalog();
})();
</script>
